[package]
name = "diffusion"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Rust + CUDA reimplementation of ComfyUI's image generation for int8 ConvRot models"

[lib]
path = "src/lib.rs"

[[bin]]
name = "diffusion"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
fancy-regex = "0.14"
unicode-normalization = "0.1"
half = "2"
png = "0.17"
memmap2 = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

# Lints that only fight how this code is written: constants copied in full from ComfyUI and PyTorch (some look like pi
# fractions), kernel launchers that mirror their C signatures, nested tuples for tensor layouts, and `% n == 0` checks.
# `cargo clippy --release` then shows real findings only.
[lints.clippy]
excessive_precision = "allow"
approx_constant = "allow"
manual_is_multiple_of = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
debug = 1
codegen-units = 16

[profile.dev]
opt-level = 1
