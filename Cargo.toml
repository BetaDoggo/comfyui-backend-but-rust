# One workspace: the diffusion library and CLI here, and the SwarmUI server crates under `swarm backend/crates`. They share
# one Cargo.lock and one target folder, so the CUDA kernels and common dependencies are built once.
[workspace]
resolver = "2"
members = [".", "swarm backend/crates/engine-api", "swarm backend/crates/comfy-server", "swarm backend/crates/native-engine"]
# `cargo test --release` runs every crate's tests. Without the CUDA toolkit, pick the server crates with
# `-p comfy-server -p swarm-engine-api`, which don't depend on this one.
default-members = [".", "swarm backend/crates/engine-api", "swarm backend/crates/comfy-server", "swarm backend/crates/native-engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
swarm-engine-api = { path = "swarm backend/crates/engine-api" }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[package]
name = "diffusion"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust + CUDA reimplementation of ComfyUI's image generation for int8 ConvRot models"

[lib]
path = "src/lib.rs"

[[bin]]
name = "diffusion"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
fancy-regex = "0.14"
unicode-normalization = "0.1"
half = "2"
png = "0.17"
memmap2 = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

# Lints that only fight how this code is written: constants copied in full from ComfyUI and PyTorch (some look like pi
# fractions), kernel launchers that mirror their C signatures, nested tuples for tensor layouts, and `% n == 0` checks.
# `cargo clippy --release` then shows real findings only.
[lints.clippy]
excessive_precision = "allow"
approx_constant = "allow"
manual_is_multiple_of = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
debug = 1
codegen-units = 16

[profile.dev]
opt-level = 1

# GIF/PNG encoding is very slow unoptimized, and the server's video tests encode dozens of frames.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.color_quant]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
