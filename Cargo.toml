[package]
name = "krea2"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Rust + CUDA reimplementation of ComfyUI's Krea 2 (int8 W8A8) text-to-image pipeline"

[lib]
path = "src/lib.rs"

[[bin]]
name = "krea2"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
fancy-regex = "0.14"
unicode-normalization = "0.1"
half = "2"
png = "0.17"
memmap2 = "0.9"
tiny_http = "0.12"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
debug = 1
codegen-units = 16

[profile.dev]
opt-level = 1
